project:
  type: website
  output-dir: _site
  pre-render: python scripts/sync_snippets.py
  render:
    - index.qmd
    - workshop.qmd
    - setup.qmd
    - handout.qmd
    - reference.qmd
    - '!workshop_mod*.qmd'
    - '!integration/**'
    - '!review/**'
    - '!_site/**'
    - '!.library/**'
  resources:
    - assets/**
    - downloads/**
    - Daten/*.csv
    - Daten/*.rds
    - Daten/*.json
    - Syntaxen/**
    - '!Syntaxen/**/*_mod.R'
    - Daten/Zwischenstaende/*.rds
    - Daten/Ergebnisse/codebook.xlsx
    - '!Daten/EigeneDaten/**'
    - '!integration/**'
    - '!review/**'
    - '!_site/**'
    - '!.library/**'
    - '!workshop_mod*.qmd'
website:
  title: "eatPrepTBA · Workshop"
  navbar:
    logo: assets/iqb-logo.png
    background: light
    left:
      - href: index.qmd
        text: Überblick
      - href: workshop.qmd
        text: Folien
      - href: setup.qmd
        text: Vorbereitung
      - href: handout.qmd
        text: Handout
      - href: reference.qmd
        text: Nachschlagen
  page-footer: "IQB · Methoden-Team | eatPrepTBA-Workshop · 26.10.2026"
  search: false
lang: de
filters:
  - scripts/newtab-links.lua
format:
  html:
    theme: [cosmo, website.scss]
    css: website.css
    toc: true
    code-copy: true
    highlight-style: arrow
    anchor-sections: true
    link-external-newwindow: true
execute:
  echo: true
  warning: false
  message: false
  freeze: false
